name: TokenBroker Worker (standing nodes)

on:
  # A run lasts ~5h50m (Actions caps jobs at 6h) and a new one starts every 6h,
  # so the nodes are standing with only a short gap between runners. Each run
  # reuses the same node tokens, so it is the same compute nodes coming back.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Never let two runs share node tokens: a second runner would fight the first
# over the same nodes. A newer run waits for the current one to finish.
concurrency:
  group: tokenbroker-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      # Share pulled Ollama models across runs. Cache keys are immutable, so
      # each run saves under a fresh key and restores the newest previous one.
      - name: Restore Ollama model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-${{ github.run_id }}
          restore-keys: ollama-models-

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      # Three worker instances share ONE local Ollama server, so a run serves
      # up to three jobs at once. The script exits itself before the job
      # timeout (so the cache post-step still runs) and fails fast if the
      # gateway rejects every node token.
      - name: Run 3 headless workers (shared Ollama)
        env:
          TB_GATEWAY: ${{ secrets.TB_GATEWAY }}
          TB_NODE_TOKEN: ${{ secrets.TB_NODE_TOKEN }}
          TB_NODE_TOKEN_2: ${{ secrets.TB_NODE_TOKEN_2 }}
          TB_NODE_TOKEN_3: ${{ secrets.TB_NODE_TOKEN_3 }}
          WORKER_RUN_MINUTES: '350'
        run: bash run-workers.sh
