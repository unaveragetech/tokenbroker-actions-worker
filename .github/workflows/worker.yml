name: TokenBroker Worker (standing nodes)

on:
  # Actions jobs max out at ~6h; re-fire every ~5h so the nodes are standing
  # with only a short gap between runners (each run reuses the same node
  # tokens, so it is the same compute nodes coming back online).
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Share pulled Ollama models across runs: every runner restores the
      # cached ~/.ollama (models) from the previous run and saves what remains
      # at the end, so repeat workloads skip the download.
      - name: Restore Ollama model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-v1
          restore-keys: ollama-models-v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      # Three worker instances on this runner share ONE local Ollama server
      # (multi-worker mode), so a single run serves up to three jobs at once.
      # Models pulled by one worker are instantly visible to the others.
      - name: Run 3 headless workers (shared Ollama)
        env:
          TB_GATEWAY: ${{ secrets.TB_GATEWAY }}
          TB_NODE_TOKEN: ${{ secrets.TB_NODE_TOKEN }}
          TB_NODE_TOKEN_2: ${{ secrets.TB_NODE_TOKEN_2 }}
          TB_NODE_TOKEN_3: ${{ secrets.TB_NODE_TOKEN_3 }}
        run: bash run-workers.sh
