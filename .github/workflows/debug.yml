name: debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python --version
          cat > c.json <<EOT
          {"name":"dbg","gateway":"https://tokenbroker.org","token":"x","private_jobs":false,"cloud_enabled":false,"storage_gb":8}
          EOT
          python -u -X faulthandler worker.py --config c.json --headless --multi 2>&1 | head -40 &
          sleep 20; echo "exit-check"; pkill -f worker.py || true
          echo ---- direct
          (python -u -X faulthandler worker.py --config c.json --headless --multi; echo "exit=$?") 2>&1 | head -40 &
          sleep 15; pkill -f worker.py || true; wait
          echo ---- with-timeout
          (timeout 10 python -u -X faulthandler worker.py --config c.json --headless --multi; echo "exit=$?") 2>&1 | head -40
